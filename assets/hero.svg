<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc">
  <title id="title">MediaAudio</title>
  <desc id="desc">A portable Windows audio workflow: original source or ALAC, with verified output.</desc>
  <defs>
