    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#38c9a4"/><stop offset="1" stop-color="#9de3c6"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#8ba3bd" stroke-opacity=".06"/></pattern>
  </defs>
  <rect width="1200" height="380" rx="22" fill="url(#bg)"/>
